name: Rebuild feed.xml

# The essays live here, so the RSS feed is generated here (one owner, no copies).
# Consumers: the profile README at github.com/tonydzi, and any
# feed reader pointed at .../clawrush/raw/main/feed.xml
on:
  push:
    branches: [main]
    paths:
      - 'longreads/**.md'
      - 'tools/build_feed.py'
      - '.github/workflows/feed.yml'
  schedule:
    # 03:00 UTC = 04:00 Lisbon — inside the fleet's night window (23:00-06:00).
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_feed.py dates each post from the commit that ADDED it

      - name: Self-test the generator
        run: python3 tools/_test_build_feed.py

      - name: Rebuild feed.xml
        run: python3 tools/build_feed.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "feed: rebuild from longreads/ [skip ci]"
          # A push landing between checkout and push makes this a non-fast-forward.
          # Do NOT rebase: feed.xml is generated, so a rebase asks git to merge two
          # machine-written versions of the same file line by line, which conflicts
          # on contact and leaves the job stopped mid-rebase (measured 2026-08-28,
          # run 33187417395). The feed is a pure function of longreads/ plus the
          # generator, so the correct move is to throw our copy away, take theirs,
          # and regenerate on top of it.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $attempt) — resetting onto origin/main and regenerating"
            git fetch origin main || exit 1
            git reset --hard FETCH_HEAD || exit 1
            python3 tools/build_feed.py
            if git diff --quiet -- feed.xml; then
              echo "feed.xml already current on origin/main — nothing left to push"
              exit 0
            fi
            git add feed.xml
            git commit -m "feed: rebuild from longreads/ [skip ci]"
          done
          echo "could not push after 3 attempts"; exit 1
